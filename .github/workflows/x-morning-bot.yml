# X morning curation bot — briefing + scheduled posts
# Week 1 default: X_DRY_RUN=true (set repo Variables to enable auto-post)

name: X Morning Bot

on:
  schedule:
    # 10:00 UTC = 07:00 BRT — generate daily briefing + queue
    - cron: "0 10 * * *"
    # Post slots: 08:00, 12:00, 17:00, 20:00 BRT
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "brief | post | pipeline"
        required: true
        default: brief
        type: choice
        options:
          - brief
          - post
          - pipeline

permissions:
  contents: write

jobs:
  x-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      X_DRY_RUN: ${{ vars.X_DRY_RUN || 'true' }}
      X_AUTO_POST: ${{ vars.X_AUTO_POST || 'false' }}
      X_MAX_POSTS_PER_DAY: ${{ vars.X_MAX_POSTS_PER_DAY || '4' }}
      X_MEDIA_ENABLED: ${{ vars.X_MEDIA_ENABLED || 'false' }}
      X_IMAGE_POSTS_PER_DAY: ${{ vars.X_IMAGE_POSTS_PER_DAY || '1' }}
      X_SCREENSHOT_ENABLED: ${{ vars.X_SCREENSHOT_ENABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (screenshots)
        if: env.X_SCREENSHOT_ENABLED == 'true'
        run: npx playwright install chromium --with-deps

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "mode=brief" >> "$GITHUB_OUTPUT"
          else
            echo "mode=post" >> "$GITHUB_OUTPUT"
          fi

      - name: Morning briefing
        if: steps.mode.outputs.mode == 'brief' || steps.mode.outputs.mode == 'pipeline'
        run: npm run career:x:brief

      - name: Post due tweets
        if: steps.mode.outputs.mode == 'post' || steps.mode.outputs.mode == 'pipeline'
        run: npm run career:x:post

      - name: Commit briefing and logs
        if: steps.mode.outputs.mode == 'brief' || steps.mode.outputs.mode == 'pipeline'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../.cursor/career/content/x/daily/ ../.cursor/career/content/x/published/ || true
          git diff --staged --quiet || git commit -m "chore(x): daily briefing $(date -u +%Y-%m-%d)"
          git push || true

      - name: Upload briefing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-briefing-${{ github.run_id }}
          path: |
            .cursor/career/content/x/daily/
            .cursor/career/.cache/x/post-queue.json
          if-no-files-found: ignore
